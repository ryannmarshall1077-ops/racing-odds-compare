<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Racing Odds Compare</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Racing Odds Compare</h1>
      <p class="subtitle" id="race-subtitle">Horse Racing &mdash; Betfair vs Sportsbet</p>
    </header>

    <section id="upcoming-races">
      <div class="section-header">
        <h2>Upcoming Races</h2>
        <button id="races-refresh-btn" title="Refresh upcoming races">&#8635;</button>
      </div>
      <ul id="races-list">
        <li class="races-status">Loading...</li>
      </ul>
    </section>

    <table id="odds-table">
      <thead>
        <tr>
          <th>
            Runner
            <button id="sort-toggle-btn" title="Toggle sort order">Sort: Edge</button>
          </th>
          <th>Sportsbet</th>
          <th>Betfair (Lay)</th>
          <th>Edge</th>
        </tr>
      </thead>
      <tbody id="odds-body">
        <!-- rows injected by popup.js -->
      </tbody>
    </table>

    <div id="hedge-control">
      <label for="hedge-input">Hedge</label>
      <input type="number" id="hedge-input" min="0" max="100" step="1" value="100" />
      <span>%</span>
      <span class="hedge-hint">100% = full lay, 0% = no lay</span>
    </div>

    <footer>
      <span id="data-source-note">Showing mock data &mdash; live odds not yet connected.</span>
      <button id="refresh-btn">Refresh live odds</button>
      <button id="scan-btn">Scan Sportsbet tab for odds</button>
    </footer>

    <script src="mock-data.js"></script>
    <script src="commission.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
